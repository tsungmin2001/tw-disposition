<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>

<title>飆神 | 台股處置看板</title>
<meta name="description" content="台股飆股/處置股每日自動追蹤 - 進處置漲跌幅、20MA乖離率、盤後漲停產業分析">
<meta property="og:title" content="飆神 | 台股處置看板">
<meta property="og:description" content="每日自動追蹤 66 檔處置中飆股 + 盤後漲停產業分析">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: radial-gradient(circle at 50% 50%, #1a1f29 0%, #0e1117 100%);
    color: #e6edf3;
    min-height: 100vh;
    overflow-x: hidden;
  }

  .page { display: flex; flex-direction: column; align-items: center; padding: 24px 16px; min-height: 100vh; }

  .meta { color: #8b949e; font-size: 13px; text-align: center; margin-bottom: 8px; }

  .hub {
    position: relative;
    width: min(700px, 92vw);
    height: min(700px, 92vw);
    margin: 30px auto;
    flex-shrink: 0;
  }

  .center-logo {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(220px, 28vw);
    height: min(220px, 28vw);
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #ff7b7b, #f85149 60%, #c1392b);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: white; font-weight: 800;
    box-shadow: 0 0 80px rgba(248, 81, 73, 0.5), inset 0 0 30px rgba(255,255,255,0.1);
    text-shadow: 0 2px 6px rgba(0,0,0,0.4);
    animation: pulse-glow 3s ease-in-out infinite;
    z-index: 10;
  }
  .center-logo .title { font-size: min(48px, 7vw); letter-spacing: 0.05em; line-height: 1; }
  .center-logo .subtitle { font-size: min(13px, 2.2vw); font-weight: 500; opacity: 0.85; margin-top: 8px; letter-spacing: 0.15em; }
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 80px rgba(248, 81, 73, 0.5), inset 0 0 30px rgba(255,255,255,0.1); }
    50%      { box-shadow: 0 0 120px rgba(248, 81, 73, 0.7), inset 0 0 40px rgba(255,255,255,0.15); }
  }

  /* 軌道線 */
  .orbit-ring {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: min(560px, 78vw);
    height: min(560px, 78vw);
    border: 1px dashed rgba(248, 81, 73, 0.2);
    border-radius: 50%;
    pointer-events: none;
  }

  .menu-card {
    position: absolute;
    top: 50%; left: 50%;
    width: min(180px, 26vw);
    height: min(130px, 19vw);
    transform: translate(-50%, -50%) rotate(var(--angle)) translateY(max(-280px, -39vw)) rotate(calc(-1 * var(--angle)));
    background: linear-gradient(135deg, rgba(22, 27, 34, 0.92), rgba(15, 20, 30, 0.92));
    border: 1px solid #30363d;
    border-radius: 14px;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    color: #e6edf3; text-decoration: none;
    transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1), border-color 0.3s, box-shadow 0.3s;
    backdrop-filter: blur(10px);
    padding: 12px;
  }
  .menu-card .icon { font-size: min(36px, 5vw); margin-bottom: 6px; }
  .menu-card .label { font-size: min(16px, 2.6vw); font-weight: 700; margin-bottom: 4px; }
  .menu-card .desc { font-size: min(11px, 1.8vw); color: #8b949e; text-align: center; line-height: 1.3; }
  .menu-card:hover {
    transform: translate(-50%, -50%) rotate(var(--angle)) translateY(max(-300px, -42vw)) rotate(calc(-1 * var(--angle))) scale(1.08);
    border-color: #f85149;
    box-shadow: 0 8px 24px rgba(248, 81, 73, 0.4);
    z-index: 5;
  }
  .menu-card.coming-soon { opacity: 0.5; pointer-events: none; border-style: dashed; }
  .menu-card.coming-soon .label { color: #8b949e; }

  .footer { color: #8b949e; font-size: 12px; text-align: center; margin-top: 20px; padding: 16px; }
  .footer a { color: #58a6ff; text-decoration: none; }

  /* 手機改網格佈局 (放射狀變網格) */
  @media (max-width: 600px) {
    .hub { width: 100%; height: auto; min-height: 600px; }
    .orbit-ring { display: none; }
    .center-logo {
      position: relative;
      transform: none;
      top: auto; left: auto;
      margin: 20px auto 30px;
      width: 160px; height: 160px;
    }
    .menu-card {
      position: relative;
      transform: none !important;
      top: auto; left: auto;
      width: calc(50% - 12px);
      height: 110px;
      display: inline-flex;
      margin: 6px;
      vertical-align: top;
    }
    .menu-card:hover {
      transform: scale(1.05) !important;
    }
  }
  @media (max-width: 600px) {
    .menu-wrapper { display: flex; flex-wrap: wrap; justify-content: center; gap: 0; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="meta">最後產生時間: 2026-06-05 23:56 (台北時間) · 仍在處置期間 66 檔</div>

  <div class="hub">
    <div class="orbit-ring"></div>
    <div class="center-logo">
      <div class="title">飆神</div>
      <div class="subtitle">DispositionGod</div>
    </div>

    <a href="/stocks.html" class="menu-card" style="--angle: 315deg">
      <div class="icon">📈</div>
      <div class="label">飆股清單</div>
      <div class="desc">處置中個股<br>66 檔即時追蹤</div>
    </a>

    <a href="/analysis.html" class="menu-card" style="--angle: 45deg">
      <div class="icon">🔍</div>
      <div class="label">盤後分析</div>
      <div class="desc">當日漲停股<br>產業熱度統計</div>
    </a>

    <a href="/screen.html" class="menu-card" style="--angle: 225deg">
      <div class="icon">🎯</div>
      <div class="label">飆股篩選</div>
      <div class="desc">3 條件全市場掃描<br>單日漲9% + MA20上揚 + 10日+20%</div>
    </a>

    <a class="menu-card coming-soon" style="--angle: 135deg">
      <div class="icon">🔔</div>
      <div class="label">處置通知</div>
      <div class="desc">Coming soon</div>
    </a>
  </div>

  <div class="footer">
    資料來源: 臺灣證券交易所 (TWSE)、證券櫃檯買賣中心 (TPEX) 公開資料

  </div>
</div>

</body>
</html>
