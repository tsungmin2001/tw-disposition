name: Daily disposition update

on:
  schedule:
    # 21:00 台北 (UTC+8) = 13:00 UTC
    - cron: '0 13 * * *'
  workflow_dispatch:   # 允許手動觸發 (Actions tab → Run workflow)

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run daily pipeline
        run: node daily_update.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw/ prices/ public/ disposition_stocks.txt tomorrow_active.txt active_list.tsv twse_companies.json tpex_companies.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Daily update $(date -u '+%Y-%m-%d %H:%M UTC')"
            # 處理併發：若 remote 有新 commit，rebase 後再 push (retry 3 次)
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "Push attempt $i failed, retrying..."
              sleep 5
            done
          fi

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy public --project-name=tw-disposition --branch=main --commit-message="Daily auto-deploy"
